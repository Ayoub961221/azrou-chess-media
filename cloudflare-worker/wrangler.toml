name = "azrou-media"
main = "worker.js"
compatibility_date = "2026-01-01"

# اسم مستودع الصور (معطى عام وليس سرّاً)
[vars]
GITHUB_REPO = "azrou-chess-media"

# ════════════════════════════════════════════════════════════════
#  ⚠️  لا تكتب GITHUB_TOKEN هنا إطلاقاً.
#      هذا الملف يُرفع إلى Git ويقرأه كل من يصل إلى المستودع.
#
#      أضفه مرة واحدة بهذا الأمر (يسألك عن القيمة بشكل مخفي):
#
#          wrangler secret put GITHUB_TOKEN
#
#      للتحقق:   wrangler secret list
#
#      التوكن يجب أن يكون Fine-grained، محصوراً في مستودع الصور،
#      بإذن  Contents: Read and write  فقط.
# ════════════════════════════════════════════════════════════════

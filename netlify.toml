[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# استدعاء دوال Netlify عبر /api/ أو /.netlify/functions/
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# إعادة توجيه كل مسارات الـ SPA إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
